<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Pig Game</title>
  </head>
  <body>
    <main>
      <section class="player player--0">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">0</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>
      <section class="player player--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">0</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <img src="dice-1.png" alt="Playing dice" class="dice hidden" />
      <button class="btn btn--new" disabled>New game</button>
      <button class="btn btn--roll" disabled>Roll dice</button>
      <button class="btn btn--hold" disabled>Hold</button>

      <p class="status" id="status" aria-live="polite"></p>

      <div class="rematch hidden" id="rematch-prompt">
        <button class="mini-btn" id="rematch-accept">Accept rematch</button>
        <button class="mini-btn" id="rematch-decline">Decline</button>
      </div>

      <div class="lobby" id="lobby">
        <h1 class="lobby-title">Pig Game</h1>
        <div class="lobby-form" id="lobby-form">
          <button class="lobby-btn" id="create-room">Create a room</button>
          <span class="lobby-or">or join a friend</span>
          <div class="lobby-join">
            <input
              id="room-input"
              class="lobby-input"
              type="text"
              maxlength="6"
              placeholder="ROOM CODE"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="lobby-btn" id="join-room">Join</button>
          </div>
        </div>
        <p class="lobby-msg" id="lobby-msg" aria-live="polite"></p>
      </div>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
